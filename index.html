<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キッズ向け・パパッとレシピ提案ツール</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; padding: 20px; background-color: #fff9e6; color: #333; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        h2 { text-align: center; color: #ff9800; font-size: 1.2em; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { font-size: 0.85em; font-weight: bold; color: #666; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 2px solid #ddd; border-radius: 6px; font-size: 1em; }
        button { background: #ff9800; color: white; border: none; padding: 12px; cursor: pointer; width: 100%; border-radius: 6px; font-weight: bold; margin-top: 5px; }
        .result-box { margin-top: 20px; padding: 15px; background: #fff3e0; border-radius: 8px; display: none; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🍳 キッズレシピ提案</h2>
        
        <!-- 調理方法の追加 -->
        <div class="input-group">
            <label>⚙️ 調理方法を増やす</label>
            <input type="text" id="newMethod" placeholder="例：オーブン">
            <button onclick="addMethod()" style="background:#03a9f4;">方法を追加する</button>
        </div>

        <div class="input-group">
            <label>⏱️ 調理方法を選択</label>
            <select id="methodSelector"><option value="any">指定なし</option></select>
        </div>

        <!-- 所要時間の選択 -->
        <div class="input-group">
            <label>⌛ 所要時間</label>
            <select id="timeSelector">
                <option value="any">指定なし</option>
                <option value="5分">5分</option>
                <option value="15分">15分</option>
                <option value="30分">30分</option>
                <option value="1時間">1時間</option>
            </select>
        </div>

        <div class="input-group">
            <label>🔍 食材</label>
            <input type="text" id="ingredient" placeholder="例：レタス">
        </div>
        
        <button onclick="suggestRecipe()">レシピを見る</button>
        <div id="result" class="result-box"></div>
    </div>

    <script>
        const initialMethods = ["電子レンジ", "包丁なし", "フライパン"];

        window.onload = function() { loadMethods(); };

        function loadMethods() {
            let methods = JSON.parse(localStorage.getItem("myMethods")) || initialMethods;
            const selector = document.getElementById('methodSelector');
            selector.innerHTML = '<option value="any">指定なし</option>';
            methods.forEach(m => {
                let opt = document.createElement('option');
                opt.value = m; opt.innerText = m;
                selector.appendChild(opt);
            });
        }

        function addMethod() {
            const input = document.getElementById('newMethod');
            if (!input.value) return;
            let methods = JSON.parse(localStorage.getItem("myMethods")) || initialMethods;
            methods.push(input.value);
            localStorage.setItem("myMethods", JSON.stringify(methods));
            input.value = "";
            loadMethods();
            alert("追加しました！");
        }

        function suggestRecipe() {
            const ing = document.getElementById('ingredient').value;
            const method = document.getElementById('methodSelector').value;
            const time = document.getElementById('timeSelector').value;
            const result = document.getElementById('result');
            
            result.style.display = "block";
            result.innerHTML = `<strong>${ing}</strong> を使って<br><strong>${method}</strong> かつ <strong>${time}</strong> で作る料理を考え中...`;
        }
    </script>
</body>
</html>
