<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キッズ向け・パパッとレシピ提案ツール</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #fff9e6; }
        .container { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #ff9800; font-size: 1.2em; }
        .input-group { margin-bottom: 15px; }
        label { font-size: 0.8em; font-weight: bold; color: #666; display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 2px solid #ddd; border-radius: 6px; font-size: 1em; }
        button { background: #ff9800; color: white; border: none; padding: 12px; cursor: pointer; width: 100%; border-radius: 6px; font-weight: bold; margin-top: 10px; }
        .recipe-item { border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 10px; background: #fafafa; position: relative; padding-top: 35px; }
        .delete-btn { background: #e53935; padding: 5px 10px; width: auto; font-size: 0.8em; position: absolute; top: 10px; right: 10px; margin: 0; }
        .edit-btn { background: #ffb300; padding: 5px 10px; width: auto; font-size: 0.8em; position: absolute; top: 10px; right: 70px; margin: 0; }
        .method-manager { background: #f0f0f0; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
        .method-tag { display: inline-block; background: #fff; border: 1px solid #ccc; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; margin: 2px; }
        .method-tag span { color: #e53935; cursor: pointer; margin-left: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="formTitle">🍳 レシピ登録＆管理</h2>
        
        <!-- 登録・編集エリア -->
        <div class="input-group">
            <input type="hidden" id="editIndex" value="-1">
            <label>📝 レシピ名</label>
            <input type="text" id="rTitle" placeholder="例：レタスとツナの和え物">
            <label>🛒 用意するもの</label>
            <textarea id="rIng" placeholder="例：レタス、ツナ缶、ごま油"></textarea>
            <label>🍳 手順</label>
            <textarea id="rSteps" placeholder="例：1. レタスをちぎる&#10;2. 全部混ぜる"></textarea>
            <label>⏱️ 調理方法（新しい方法も追加できます）</label>
            <input type="text" id="newMethod" placeholder="新しい調理方法を入力">
            <select id="rMethod"></select>
            
            <!-- 間違えて登録した調理方法の削除用エリア -->
            <div class="method-manager">
                <label style="margin-bottom: 3px;">登録されている調理方法（×で削除できます）:</label>
                <div id="methodTagsList"></div>
            </div>

            <label>⌛ 所要時間</label>
            <select id="rTime">
                <option value="5分">5分</option>
                <option value="15分">15分</option>
                <option value="30分">30分</option>
                <option value="1時間">1時間</option>
            </select>
            <button id="saveBtn" onclick="saveRecipe()" style="background:#4caf50;">レシピを保存する</button>
            <button id="cancelBtn" onclick="resetForm()" style="background:#999; display:none;">編集をキャンセル</button>
        </div>

        <hr>

        <!-- 一覧エリア -->
        <div class="input-group">
            <label>📋 保存したレシピ一覧</label>
            <button onclick="showRecipes()">一覧を更新する</button>
        </div>
        <div id="recipeList"></div>
    </div>

    <script>
        window.onload = () => { loadMethods(); showRecipes(); };

        function loadMethods() {
            const methods = JSON.parse(localStorage.getItem("myMethods")) || ["電子レンジ", "包丁なし", "フライパン"];
            const select = document.getElementById('rMethod');
            select.innerHTML = methods.map(m => `<option value="${m}">${m}</option>`).join('');

            // 調理方法の削除用タグリストを表示
            const tagsDiv = document.getElementById('methodTagsList');
            tagsDiv.innerHTML = methods.map(m => `<span class="method-tag">${m} <span onclick="deleteMethod('${m}')">×</span></span>`).join('');
        }

        function deleteMethod(methodName) {
            let methods = JSON.parse(localStorage.getItem("myMethods")) || ["電子レンジ", "包丁なし", "フライパン"];
            if (methods.length <= 1) {
                alert("調理方法は最低1つは必要です！");
                return;
            }
            if (confirm(`調理方法「${methodName}」を削除しますか？`)) {
                methods = methods.filter(m => m !== methodName);
                localStorage.setItem("myMethods", JSON.stringify(methods));
                loadMethods();
            }
        }

        function saveRecipe() {
            const title = document.getElementById('rTitle').value;
            const ing = document.getElementById('rIng').value;
            const steps = document.getElementById('rSteps').value;
            const editIndex = parseInt(document.getElementById('editIndex').value);

            if (!title || !ing || !steps) {
                alert("レシピ名、用意するもの、手順はすべて入力してください！");
                return;
            }

            const newM = document.getElementById('newMethod').value.trim();
            if(newM) {
                const methods = JSON.parse(localStorage.getItem("myMethods")) || ["電子レンジ", "包丁なし", "フライパン"];
                if(!methods.includes(newM)) {
                    methods.push(newM);
                    localStorage.setItem("myMethods", JSON.stringify(methods));
                    loadMethods();
                }
                document.getElementById('newMethod').value = "";
            }

            const recipe = {
                title: title,
                ing: ing,
                steps: steps,
                method: document.getElementById('rMethod').value,
                time: document.getElementById('rTime').value
            };
            
            let list = JSON.parse(localStorage.getItem("myRecipes")) || [];

            if (editIndex === -1) {
                list.push(recipe);
                alert("レシピを保存しました！");
            } else {
                list[editIndex] = recipe;
                alert("レシピを更新しました！");
            }

            localStorage.setItem("myRecipes", JSON.stringify(list));
            resetForm();
            showRecipes();
        }

        function editRecipe(index) {
            let list = JSON.parse(localStorage.getItem("myRecipes")) || [];
            let r = list[index];

            document.getElementById('rTitle').value = r.title;
            document.getElementById('rIng').value = r.ing;
            document.getElementById('rSteps').value = r.steps;
            document.getElementById('rMethod').value = r.method;
            document.getElementById('rTime').value = r.time;
            document.getElementById('editIndex').value = index;

            document.getElementById('formTitle').innerText = "🍳 レシピを編集中";
            document.getElementById('saveBtn').innerText = "変更を保存する";
            document.getElementById('cancelBtn').style.display = "block";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('rTitle').value = "";
            document.getElementById('rIng').value = "";
            document.getElementById('rSteps').value = "";
            document.getElementById('newMethod').value = "";
            document.getElementById('editIndex').value = "-1";

            document.getElementById('formTitle').innerText = "🍳 レシピ登録＆管理";
            document.getElementById('saveBtn').innerText = "レシピを保存する";
            document.getElementById('cancelBtn').style.display = "none";
        }

        function showRecipes() {
            const list = JSON.parse(localStorage.getItem("myRecipes")) || [];
            const listDiv = document.getElementById('recipeList');
            
            if (list.length === 0) {
                listDiv.innerHTML = "<p style='font-size: 0.9em; color: #888; text-align: center;'>保存されたレシピはまだありません。</p>";
                return;
            }

            listDiv.innerHTML = list.map((r, index) => `
                <div class="recipe-item">
                    <strong>${r.title}</strong><br>
                    <small style="color: #666;">⚙️ ${r.method} / ⌛ ${r.time}</small><br>
                    <div style="margin-top: 5px; font-size: 0.9em;">
                        <strong>【材料】</strong><br>${r.ing.replace(/\n/g, "<br>")}<br>
                        <strong>【手順】</strong><br>${r.steps.replace(/\n/g, "<br>")}
                    </div>
                    <button class="edit-btn" onclick="editRecipe(${index})">編集</button>
                    <button class="delete-btn" onclick="deleteRecipe(${index})">削除</button>
                </div>`).join('');
        }

        function deleteRecipe(index) {
            if (confirm("このレシピを削除しますか？")) {
                let list = JSON.parse(localStorage.getItem("myRecipes")) || [];
                list.splice(index, 1);
                localStorage.setItem("myRecipes", JSON.stringify(list));
                showRecipes();
            }
        }
    </script>
</body>
</html>
