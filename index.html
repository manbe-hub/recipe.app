<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>レシピ管理＆お買い物サポート</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f9f9f9; color: #333; }
        h1, h2 { color: #2c3e50; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        input, select, button { padding: 8px; margin: 5px 0; font-size: 14px; width: 100%; box-sizing: border-box; }
        .search-box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        button { cursor: pointer; background: #3498db; color: white; border: none; border-radius: 4px; width: auto; }
        button:hover { background: #2980b9; }
        .recipe-card { background: #fdfdfd; border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 6px; }
        .badge { display: inline-block; padding: 2px 6px; font-size: 12px; background: #e0e0e0; border-radius: 4px; margin-right: 5px; }
        .owner-only { display: none; background: #fff3cd; padding: 10px; border: 1px solid #ffeeba; border-radius: 4px; }
        .shopping-item { display: flex; align-items: center; justify-content: space-between; margin: 5px 0; }
        .counter-btn { padding: 2px 8px; font-weight: bold; background: #e74c3c; width: auto; }
        .counter-btn.plus { background: #2ecc71; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍳 レシピ管理 ＆ お買い物サポート</h1>
    <p>あなた専用ID: <span id="userId"></span> | <button onclick="toggleOwnerMode()">オーナーモード切替</button></p>

    <!-- オーナー限定レシピ登録エリア -->
    <div id="ownerArea" class="owner-only section">
        <h3>👑 オーナー用：新規レシピ登録</h3>
        <input type="text" id="newTitle" placeholder="レシピ名">
        <input type="text" id="newCategory" placeholder="カテゴリ（メイン等）">
        <input type="number" id="newTime" placeholder="調理時間（分）">
        <input type="text" id="newIngredients" placeholder="材料（例: じゃがいも:1, 豚ひき肉:100）">
        <button onclick="addRecipe()">レシピを追加</button>
    </div>

    <!-- 🔍 検索エリア（食材・レシピ名・調理時間） -->
    <div class="section">
        <h2>🔍 レシピを探す</h2>
        <div class="search-box">
            <input type="text" id="searchIngredient" placeholder="🍅 食材で検索（例: じゃがいも、豚ひき肉）" oninput="searchRecipes()">
            <input type="text" id="searchKeyword" placeholder="🏷️ レシピ名で検索..." oninput="searchRecipes()">
            <select id="searchTime" onchange="searchRecipes()">
                <option value="">⌛ 調理時間（指定なし）</option>
                <option value="15">15分以内</option>
                <option value="30">30分以内</option>
                <option value="60">60分以内</option>
            </select>
        </div>
        <div id="recipeList"></div>
    </div>

    <!-- 作りたいリスト ＆ お買い物リスト -->
    <div class="section">
        <h2>🛒 作りたいリスト ＆ お買い物リスト</h2>
        <div id="wantToList"></div>
        <h3>お買い物チェックリスト（数量調整可能）</h3>
        <div id="shoppingList"></div>
    </div>

    <!-- 余り食材からの提案 -->
    <div class="section">
        <h2>💡 余り食材からのレシピ提案</h2>
        <input type="text" id="leftoverInput" placeholder="例: 鶏もも肉, 玉ねぎ">
        <button onclick="suggestRecipes()">今作れるものを探す</button>
        <div id="suggestionResult"></div>
    </div>
</div>

<script>
    // 1. 匿名ユーザー識別（LocalStorage）
    let userId = localStorage.getItem('app_user_id');
    if (!userId) {
        userId = 'user_' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('app_user_id', userId);
    }
    document.getElementById('userId').innerText = userId;

    let isOwner = false;
    function toggleOwnerMode() {
        const pass = prompt("オーナーパスコードを入力してください（初期: admin）:");
        if (pass === 'admin') {
            isOwner = !isOwner;
            document.getElementById('ownerArea').style.display = isOwner ? 'block' : 'none';
            alert(isOwner ? "オーナーモードになりました" : "一般モードに戻りました");
        } else if (pass !== null) {
            alert("パスコードが違います");
        }
    }

    // サンプルレシピデータ（材料をキー・バリューで保持）
    let recipes = [
        { id: 1, title: "じゃがいもガレット", category: "メイン", time: 15, ingredients: {"じゃがいも": 1, "ブロッコリー": 0.25, "片栗粉": 0.5} },
        { id: 2, title: "キャベツとチーズのガレット", category: "メイン", time: 15, ingredients: {"キャベツ": 0.25, "ベーコン": 40, "チーズ": 1} },
        { id: 3, title: "トマたまキーマカレー", category: "メイン", time: 30, ingredients: {"玉ねぎ": 1, "豚ひき肉": 100, "トマト缶": 0.5} },
        { id: 4, title: "さば味噌", category: "メイン", time: 15, ingredients: {"冷凍サバ": 1, "生姜": 1, "味噌": 1} }
    ];

    let userFavorites = JSON.parse(localStorage.getItem('favorites_' + userId)) || [];
    let wantToCook = JSON.parse(localStorage.getItem('wantToCook_' + userId)) || [];
    let shoppingQuantities = {};

    // 🔍 検索・絞り込みロジック（食材 ＆ レシピ名 ＆ 調理時間以内 ＋ 短い順ソート）
    function searchRecipes() {
        const ingQuery = document.getElementById('searchIngredient').value.toLowerCase().trim();
        const keyword = document.getElementById('searchKeyword').value.toLowerCase().trim();
        const maxTime = parseInt(document.getElementById('searchTime').value) || 999;

        let filtered = recipes.filter(r => {
            // 1. 食材名で一致するか（持っている材料のキーに含まれるか）
            const matchesIng = ingQuery === "" || Object.keys(r.ingredients).some(ing => ing.toLowerCase().includes(ingQuery));
            // 2. レシピ名で一致するか
            const matchesName = r.title.toLowerCase().includes(keyword);
            // 3. 指定した調理時間以内か
            const matchesTime = r.time <= maxTime;

            return matchesIng && matchesName && matchesTime;
        });

        // 調理時間が短い順にソート
        filtered.sort((a, b) => a.time - b.time);

        const listDiv = document.getElementById('recipeList');
        listDiv.innerHTML = '';

        if (filtered.length === 0) {
            listDiv.innerHTML = '<p>条件に一致するレシピはありません。</p>';
            return;
        }

        filtered.forEach(r => {
            const isFav = userFavorites.includes(r.id);
            const isWant = wantToCook.includes(r.id);
            const ingText = Object.keys(r.ingredients).join(', ');

            let html = `
                <div class="recipe-card">
                    <strong>🍽️ ${r.title}</strong> 
                    <span class="badge">${r.category}</span>
                    <span class="badge">⌛ ${r.time}分</span><br>
                    <small>🛒 材料: ${ingText}</small><br><br>
                    <button onclick="toggleFavorite(${r.id})">${isFav ? '❤️ お気に入り解除' : '🤍 お気に入り'}</button>
                    <button onclick="toggleWantToCook(${r.id})">${isWant ? '✅ 作りたいリストから外す' : '➕ 作りたいリストに追加'}</button>
                    ${isOwner ? `<button style="background:#e74c3c;" onclick="deleteRecipe(${r.id})">削除</button>` : ''}
                </div>
            `;
            listDiv.innerHTML += html;
        });
    }

    // お気に入り切替
    function toggleFavorite(id) {
        if (userFavorites.includes(id)) {
            userFavorites = userFavorites.filter(item => item !== id);
        } else {
            userFavorites.push(id);
        }
        localStorage.setItem('favorites_' + userId, JSON.stringify(userFavorites));
        searchRecipes();
    }

    // 作りたいリスト切替 ＆ お買い物リスト自動生成
    function toggleWantToCook(id) {
        if (wantToCook.includes(id)) {
            wantToCook = wantToCook.filter(item => item !== id);
        } else {
            wantToCook.push(id);
        }
        localStorage.setItem('wantToCook_' + userId, JSON.stringify(wantToCook));
        updateWantToList();
        updateShoppingList();
        searchRecipes();
    }

    function updateWantToList() {
        const div = document.getElementById('wantToList');
        div.innerHTML = wantToCook.map(id => {
            const r = recipes.find(item => item.id === id);
            return `<div>📌 ${r ? r.title : ''}</div>`;
        }).join('') || '<p>なし</p>';
    }

    // お買い物リスト生成 ＋ カウンター機能付き
    function updateShoppingList() {
        let aggregated = {};
        wantToCook.forEach(id => {
            const r = recipes.find(item => item.id === id);
            if (r && r.ingredients) {
                for (let [ing, qty] of Object.entries(r.ingredients)) {
                    aggregated[ing] = (aggregated[ing] || 0) + qty;
                }
            }
        });

        const listDiv = document.getElementById('shoppingList');
        listDiv.innerHTML = '';

        if (Object.keys(aggregated).length === 0) {
            listDiv.innerHTML = '<p>作りたいリストにレシピを追加するとお買い物リストが作成されます。</p>';
            shoppingQuantities = {};
            return;
        }

        for (let [ing, qty] of Object.entries(aggregated)) {
            if (shoppingQuantities[ing] === undefined) {
                shoppingQuantities[ing] = qty;
            }
        }

        for (let [ing, qty] of Object.entries(aggregated)) {
            let currentQty = shoppingQuantities[ing];
            let html = `
                <div class="shopping-item">
                    <label><input type="checkbox"> ${ing} : <strong>${currentQty}</strong></label>
                    <div>
                        <button class="counter-btn" onclick="adjustQty('${ing}', -0.5)">-</button>
                        <button class="counter-btn plus" onclick="adjustQty('${ing}', 0.5)">+</button>
                    </div>
                </div>
            `;
            listDiv.innerHTML += html;
        }
    }

    function adjustQty(ing, amount) {
        if (shoppingQuantities[ing] !== undefined) {
            shoppingQuantities[ing] = Math.max(0, shoppingQuantities[ing] + amount);
            updateShoppingList();
        }
    }

    // 余り食材からの逆引き提案
    function suggestRecipes() {
        const inputStr = document.getElementById('leftoverInput').value;
        const available = inputStr.split(',').map(s => s.trim()).filter(s => s);
        const resultDiv = document.getElementById('suggestionResult');

        if (available.length === 0) {
            resultDiv.innerHTML = '<p>食材を入力してください。</p>';
            return;
        }

        let matches = recipes.filter(r => {
            const ingKeys = Object.keys(r.ingredients);
            return ingKeys.some(ing => available.some(av => ing.includes(av)));
        });

        if (matches.length === 0) {
            resultDiv.innerHTML = '<p>一致するレシピが見つかりませんでした。</p>';
            return;
        }

        resultDiv.innerHTML = '<h4>🍳 今作れるおすすめレシピ：</h4>' + matches.map(r => `<div>・${r.title}（⌛ ${r.time}分）</div>`).join('');
    }

    // オーナー用レシピ追加
    function addRecipe() {
        const title = document.getElementById('newTitle').value;
        const category = document.getElementById('newCategory').value;
        const time = parseInt(document.getElementById('newTime').value) || 15;
        if (!title) return alert('レシピ名を入力してください');

        recipes.push({ id: Date.now(), title, category, time, ingredients: {"基本食材": 1} });
        alert('レシピを追加しました！');
        document.getElementById('newTitle').value = '';
        searchRecipes();
    }

    // オーナー用レシピ削除
    function deleteRecipe(id) {
        if (confirm('本当に削除しますか？')) {
            recipes = recipes.filter(r => r.id !== id);
            searchRecipes();
        }
    }

    // 初期読み込み
    searchRecipes();
    updateWantToList();
    updateShoppingList();
</script>

</body>
</html>
