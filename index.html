<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キッズレシピ提案アプリ（画像対応版）</title>
    <style>
        :root {
            --bg-color: #f4efe9;        
            --card-bg: #fcf9f5;         
            --text-main: #594d45;       
            --accent-color: #d4a373;    
            --accent-pink: #d8928c;     
            --border-color: #e3dbd0;    
            --tab-inactive: #e8dfd3;    
            --tab-active: #8c8278;      
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 680px;
            width: 100%;
            padding: 20px;
        }

        .main-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            width: 100%;
        }

        .recipe-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 4px 20px rgba(89, 77, 69, 0.05);
            flex: 1;
            position: relative;
        }

        .recipe-header {
            display: flex;
            align-items: baseline;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 24px;
        }

        .recipe-no {
            font-size: 0.85rem;
            color: var(--accent-pink);
            letter-spacing: 0.05em;
        }

        .recipe-no span {
            font-size: 1.6rem;
            font-weight: bold;
            display: block;
            line-height: 1;
            margin-top: 2px;
        }

        .recipe-title {
            font-size: 1.8rem;
            font-weight: normal;
            letter-spacing: 0.05em;
            margin: 0;
            color: var(--text-main);
        }

        .photo-item {
            background-color: #e8dfd3;
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
            max-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8c8278;
            font-size: 0.9rem;
            position: relative;
            border: 1px solid var(--border-color);
            margin-bottom: 28px;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .day-tabs {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .day-tab {
            width: 44px;
            height: 52px;
            background-color: var(--tab-inactive);
            border: none;
            border-radius: 8px 0 0 8px;
            color: var(--text-main);
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .day-tab:hover { background-color: #dfd5c7; }
        .day-tab.active { background-color: var(--tab-active); color: #fff; }

        input[type="text"], input[type="password"], select, textarea, input[type="file"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: inherit;
            background: #fff;
            color: var(--text-main);
            margin-bottom: 10px;
        }
        textarea { resize: vertical; min-height: 60px; }
        
        button.app-btn {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 10px 14px;
            cursor: pointer;
            width: 100%;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: 0.2s;
            margin-top: 5px;
        }
        button.app-btn:hover { background: #403630; }
        
        .action-buttons { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-manage, .btn-fav, .btn-calc {
            background: var(--tab-inactive);
            color: var(--text-main);
            font-size: 0.85rem;
            padding: 10px 6px;
            flex: 1;
            margin: 0;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            border: none;
            cursor: pointer;
        }
        .btn-manage:hover, .btn-fav:hover, .btn-calc:hover { background: #dfd5c7; }
        
        .box { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; background: #fff; border: 1px solid var(--border-color); }
        .box h3 { margin-top: 0; font-size: 1em; text-align: center; margin-bottom: 12px; color: var(--text-main); }
        
        .search-box { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 20px; }
        .search-box h3 { font-size: 1rem; color: var(--text-main); margin-top: 0; margin-bottom: 15px; text-align: center; }

        .fixed-settings-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: var(--tab-active);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.1em;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fixed-settings-btn:hover { background: var(--text-main); }

        .settings-panel {
            display: none;
            position: fixed;
            top: 60px;
            right: 15px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(89,77,69,0.15);
            border: 1px solid var(--border-color);
            z-index: 999;
            width: 250px;
        }

        .delete-btn, .edit-btn {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            color: white;
        }
        .delete-btn { background: #d8928c; }
        .edit-btn { background: #d4a373; }
        
        .genre-tag { display: inline-block; background: var(--tab-inactive); color: var(--text-main); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-bottom: 6px; font-weight: bold; }
        
        .image-input-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }
        .img-tab-btn {
            flex: 1;
            padding: 6px;
            font-size: 0.75rem;
            background: var(--tab-inactive);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-main);
        }
        .img-tab-btn.active {
            background: var(--tab-active);
            color: white;
        }

        /* 食材マスター・献立・買い物リスト */
        .ingredient-editor { margin-top: 8px; }
        .ingredient-row {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            background: #fcfaf7;
        }
        .ingredient-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .ingredient-row-grid.three { grid-template-columns: 1fr 1fr 1fr; }
        .ingredient-row select, .ingredient-row input { margin-bottom: 6px; }
        .ingredient-row .remove-ingredient-btn {
            width: 100%; padding: 6px; border: 0; border-radius: 5px;
            background: #d8928c; color: #fff; cursor: pointer; font-weight: bold;
        }
        .add-ingredient-btn {
            width: 100%; padding: 9px; border: 1px dashed var(--accent-color);
            border-radius: 6px; background: #fff; color: var(--text-main); cursor: pointer; font-weight: bold;
        }
        .ingredient-help { font-size: .75rem; color: #887c73; line-height: 1.5; margin: 4px 0 8px; }
        .legacy-materials { display:none; }
        .ingredient-cut-wrap { margin-top:6px; }
        .ingredient-cut-label { font-size:.78rem; color:#6f6258; margin-bottom:3px; display:block; }
        .ing-cut { width:100%; box-sizing:border-box; }
        .ing-cut-custom { width:100%; box-sizing:border-box; margin-top:5px; }
        .menu-recipe-row {
            border: 1px solid var(--border-color); border-radius: 8px; padding: 9px; margin-bottom: 8px;
            background: #fcfaf7;
        }
        .menu-recipe-row label { display:flex; align-items:center; gap:8px; cursor:pointer; }
        .menu-recipe-row input[type=number] { width: 75px; padding: 6px; margin: 0; }
        .shopping-item {
            display:flex; justify-content:space-between; gap:10px; padding:8px 4px;
            border-bottom:1px solid var(--border-color);
        }
        .shopping-category { margin-top:12px; font-weight:bold; font-size:.85rem; color:var(--accent-pink); }
        .shopping-empty { text-align:center; color:#888; padding:15px 0; font-size:.85rem; }
        .recipe-action-buttons{display:flex;gap:6px;margin-top:10px;}
        .recipe-action-btn{flex:1;border:0;border-radius:6px;padding:8px 6px;cursor:pointer;font-weight:bold;font-size:.82rem;}
        .recipe-action-btn.favorite{background:#f0d6d3;color:#7a403c;}
        .recipe-action-btn.favorite.active{background:#d8928c;color:#fff;}
        .recipe-action-btn.shopping{background:#e8dfd3;color:#594d45;}
        
        .search-results-box { padding:15px; border-radius:8px; margin-bottom:20px; display:block; background:#fff; border:1px solid var(--border-color); }
        .calc-actions { display:flex; gap:6px; }
        .calc-actions button { flex:1; }
        @media (max-width: 520px) {
            .ingredient-row-grid, .ingredient-row-grid.three { grid-template-columns: 1fr; }
        }
    </style>

    <!-- Firebase SDK -->

        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCMH1b71DcLIeFR6R5QmqQrSqfqYr-kuQQ",
          authDomain: "recipe-c69de.firebaseapp.com",
          projectId: "recipe-c69de",
          storageBucket: "recipe-c69de.firebasestorage.app",
          messagingSenderId: "171060531271",
          appId: "1:171060531271:web:93c6ff78793783cb54e162",
          measurementId: "G-7B0DGX9648"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.db = db;
        window.storage = storage;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.doc = doc;
        window.deleteDoc = deleteDoc;
        window.updateDoc = updateDoc;
        window.ref = ref;
        window.uploadBytes = uploadBytes;
        window.getDownloadURL = getDownloadURL;

        window.onload = async function() {
            loadMethodSelectors();
            await fetchAllRecipesCache(); 
            await displayCustomRecipes();
        };
    </script>
</head>
<body>

    <button class="fixed-settings-btn" onclick="toggleSettingsPanel()" title="管理設定">⚙️</button>

    <div id="settingsPanel" class="settings-panel">
        <label style="margin-bottom: 6px; color: var(--text-main); font-size: 0.85rem; display: block;">🔐 パスワード認証</label>
        <div style="display: flex; gap: 5px;">
            <input type="password" id="ownerPassword" placeholder="パスワードを入力" style="padding: 6px; font-size: 0.8rem; flex: 1; margin-bottom: 0;">
            <button class="app-btn" onclick="checkOwnerPassword()" style="margin: 0; width: auto; padding: 6px 10px; font-size: 0.8rem;">解除</button>
        </div>
        <p id="authStatus" style="font-size: 0.75rem; color: #2e7d32; margin-top: 6px; display: none;">認証済みです</p>
        <button class="app-btn" onclick="toggleRegisterForm()" style="margin-top: 8px; font-size: 0.8rem; padding: 6px;">➕ 新規レシピ登録を開く</button>
    </div>

    <div class="app-container">
        <!-- 新規レシピ登録・編集フォーム -->
        <div id="registerForm" class="box register-box" style="display: none;">
            <h3 id="formHeading">オリジナルレシピ登録</h3>
            <input type="hidden" id="editDocId" value="">
            
            <div class="input-group">
                <label>📸 料理の画像追加</label>
                <div class="image-input-tabs">
                    <button type="button" id="tabFileBtn" class="img-tab-btn active" onclick="switchImageInput('file')">📁 ファイル選択</button>
                    <button type="button" id="tabUrlBtn" class="img-tab-btn" onclick="switchImageInput('url')">🔗 URL入力</button>
                </div>
                <div id="fileInputArea">
                    <input type="file" id="regImageFile" accept="image/*">
                </div>
                <div id="urlInputArea" style="display: none;">
                    <input type="text" id="regImageUrl" placeholder="例：https://example.com/image.jpg">
                </div>
            </div>

            <div class="input-group">
                <label>🍅 メイン食材</label>
                <div class="ingredient-row-grid">
                    <select id="regMainCategory" onchange="updateMainSubcategories()"></select>
                    <select id="regMainSubcategory" onchange="updateMainIngredients()"></select>
                </div>
                <select id="regMainIngredient" onchange="syncMainIngredient()"></select>
                <input type="hidden" id="regIngredient">
                <div class="ingredient-help">食材名はマスターから選択。表記ゆれを防ぐため、登録データには食材キーを保存します。</div>
            </div>
            <div class="input-group">
                <label>🏷️ ジャンル</label>
                <select id="regGenre">
                    <option value="メイン">メイン</option>
                    <option value="副菜">副菜</option>
                    <option value="汁物">汁物</option>
                    <option value="主食(ご飯・麺)">主食(ご飯・麺)</option>
                    <option value="デザート">デザート</option>
                    <option value="お弁当">お弁当</option>
                    <option value="作り置き">作り置き</option>
                </select>
            </div>
            <div class="input-group">
                <label>⏱️ 調理方法</label>
                <select id="regMethod"></select>
            </div>
            <div class="input-group">
                <label>⌛ 所要時間</label>
                <select id="regTime">
                    <option value="5分">5分</option>
                    <option value="15分">15分</option>
                    <option value="30分">30分</option>
                    <option value="1時間">1時間</option>
                </select>
            </div>
            <div class="input-group">
                <label>📝 レシピ名</label>
                <input type="text" id="regTitle" placeholder="例：ワンパン豆腐ハンバーグ">
            </div>
            <div class="input-group">
                <label>🛒 用意するもの</label>
                <div class="ingredient-help">「カテゴリ → 食材」を選び、数量・単位・切り方を入力してください。切り方は候補から選択でき、「その他」で自由入力もできます。同じ食材は自動で統一して集計できます。</div>
                <div id="ingredientEditor" class="ingredient-editor"></div>
                <button type="button" class="add-ingredient-btn" onclick="addIngredientRow()">＋ 食材を追加</button>
                <textarea id="regIngredientsList" class="legacy-materials"></textarea>
            </div>
            <div class="input-group">
                <label>🍳 手順（作り方）</label>
                <textarea id="regSteps" placeholder="例：1. 玉ねぎを切る&#10;2. 混ぜて焼く"></textarea>
            </div>
            <!-- ▼ ボタンのアクションを明確に条件分岐する関数へ変更 -->
            <button class="app-btn" id="submitRecipeBtn" onclick="handleRecipeSubmit()">このレシピを登録</button>
            <button class="app-btn" onclick="hideRegisterForm()" style="background: #a89f91;">閉じる</button>
        </div>

        <div class="main-wrapper">
            <div class="recipe-card">
                <div class="recipe-header">
                    <div class="recipe-no">
                        Recipe<br><span>03</span>
                    </div>
                    <h1 class="recipe-title">キッズレシピ提案アプリ</h1>
                </div>

                <div class="action-buttons">
                    <button class="btn-manage" onclick="toggleManageForm()">📋 一覧</button>
                    <button class="btn-fav" onclick="toggleFavForm()">⭐ お気に入り</button>
                    <button class="btn-calc" onclick="toggleCalcForm()">🛒 作るリスト</button>
                </div>

                <div id="manageForm" class="box manage-box" style="display: none;">
                    <h3>📋 登録レシピ一覧</h3>
                    <div id="customRecipesList" style="font-size: 0.85rem;">読み込み中...</div>
                    <button class="app-btn" onclick="toggleManageForm()" style="background: #a89f91; margin-top: 10px;">閉じる</button>
                </div>

                <div id="favForm" class="box fav-box" style="display: none;">
                    <h3>⭐ お気に入り一覧</h3>
                    <div id="favoritesList" style="font-size: 0.85rem;"></div>
                    <button class="app-btn" onclick="toggleFavForm()" style="background: #a89f91; margin-top: 10px;">閉じる</button>
                </div>

                <div id="calcBox" class="box calc-box" style="display: none;">
                    <h3>🗓️ 献立 → 必要食材 → 買い物リスト</h3>
                    <div class="ingredient-help">作るリストに追加されたレシピをすべて対象に、人数を設定すると、同じ食材をまとめて必要数量を計算します。</div>

		    <div style="margin-bottom: 12px; display: flex; align-items: center; gap: 8px; background: #fcfaf7; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px;">
                        <label for="globalServings" style="font-weight: bold; font-size: 0.9rem;">👪 作る人数（一括）:</label>
                        <input type="number" id="globalServings" min="0.5" step="0.5" value="2" style="width: 70px; margin: 0; padding: 6px;">
                        <span style="font-size: 0.9rem;">人分</span>
                    </div>

                    <div id="menuRecipeList"></div>
                    <div class="calc-actions">
                        <button type="button" class="app-btn" onclick="calculateShoppingList()">🧮 必要数量を計算</button>
                        <button type="button" class="app-btn" onclick="toggleCalcForm()" style="background:#a89f91;">閉じる</button>
                    </div>
                    <div id="shoppingListResult" style="margin-top:14px;"></div>
                </div>

                <div class="search-box">
                    <h3>🔍 レシピを探す</h3>
                    <div class="input-group">
                        <label for="searchIngredient">🍅 食材</label>
                        <input type="text" id="searchIngredient" placeholder="例：豆腐（空欄でもOK）">
                    </div>
                    <div class="input-group">
                        <label for="searchTitle">📝 レシピ名</label>
                        <input type="text" id="searchTitle" placeholder="例：親子丼（空欄でもOK）">
                    </div>
                    <div class="input-group">
                        <label for="searchTime">⌛ 調理時間</label>
                        <select id="searchTime">
                            <option value="any">指定なし</option>
                            <option value="5">5分以内</option>
                            <option value="15">15分以内</option>
                            <option value="30">30分以内</option>
                            <option value="60">1時間以内</option>
                            <option value="90">1時間30分以内</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="searchGenre">🏷️ ジャンル</label>
                        <select id="searchGenre">
                            <option value="any">指定なし</option>
                            <option value="メイン">メイン</option>
                            <option value="副菜">副菜</option>
                            <option value="汁物">汁物</option>
                            <option value="主食(ご飯・麺)">主食(ご飯・麺)</option>
                            <option value="デザート">デザート</option>
                            <option value="お弁当">お弁当</option>
                            <option value="作り置き">作り置き</option>
                        </select>
                    </div>





                    <button class="app-btn" id="searchRecipeBtn" onclick="suggestRecipe()">この条件で探す</button>
                </div>
                
                <div id="result" style="display:none;"></div>
            </div>

            <div class="day-tabs">
                <button class="day-tab">月</button>
                <button class="day-tab">火</button>
                <button class="day-tab active">水</button>
                <button class="day-tab">木</button>
                <button class="day-tab">金</button>
            </div>
        </div>
    </div>

        function flattenMaster() {
            const out = {};
            Object.entries(INGREDIENT_MASTER).forEach(([cat, subs]) => {
                Object.entries(subs).forEach(([sub, items]) => {
                    items.forEach(item => out[item.key] = { ...item, category:cat, subcategory:sub });
                });
            });
            return out;
        }
        const INGREDIENT_BY_KEY = flattenMaster();

        function getIngredientByKey(key) { return INGREDIENT_BY_KEY[key] || null; }
        function findIngredientKey(name) {
            if (!name) return null;
            const n = String(name).trim().replace(/[　 ]/g, "");
            if (INGREDIENT_ALIASES[n]) return INGREDIENT_ALIASES[n];
            const exact = Object.values(INGREDIENT_BY_KEY).find(x => x.name.replace(/[　 ]/g, "") === n);
            return exact ? exact.key : null;
        }
        function getIngredientName(key, fallback="") {
            return getIngredientByKey(key)?.name || fallback || "未登録食材";
        }

        function toggleFavoriteRecipe(id){
            favoriteRecipeIds = isFavoriteRecipe(id)
                ? favoriteRecipeIds.filter(x=>x!==id)
                : [...favoriteRecipeIds, id];
            saveFavoriteRecipeIds();
            displayCustomRecipes();
            renderFavoritesList();
            if(document.getElementById('result')?.style.display==='block') suggestRecipe();

        function addRecipeToShoppingList(id){
            const ids=JSON.parse(localStorage.getItem('shoppingRecipeIdsV1') || '[]');
            if(!ids.includes(id)) ids.push(id);
            localStorage.setItem('shoppingRecipeIdsV1', JSON.stringify(ids));
            renderMenuRecipeList();
            const recipe=allRegisteredRecipesCache.find(r=>r.id===id);
            alert(recipe ? `「${recipe.title||'無題'}」を作るリストに追加しました！` : '作るリストに追加しました！');
        }

        function removeRecipeFromShoppingList(id){
            const ids=JSON.parse(localStorage.getItem('shoppingRecipeIdsV1') || '[]');

            renderMenuRecipeList();
        }

        function renderFavoritesList(){
            const box=document.getElementById('favoritesList');
            if(!box)return;
            const recipes=allRegisteredRecipesCache.filter(r=>favoriteRecipeIds.includes(r.id));
            if(!recipes.length){
                box.innerHTML='<div class="shopping-empty">お気に入りはまだありません。</div>';
                return;

            box.innerHTML=recipes.map(r=>`
                <div class="recipe-card" style="margin-bottom:10px;">
                    <div class="recipe-title" style="font-size:1.05rem;">🍽️ ${escapeHtml(r.title||'無題')}</div>

        function setIngredientCut(row, cut) {
            const sel=row.querySelector('.ing-cut');
            const custom=row.querySelector('.ing-cut-custom');
            const value=String(cut || '').trim();
            if(!value){
                sel.value='';
                custom.value='';
                custom.style.display='none';
                return;
            }
            const exists=[...sel.options].some(o=>o.value===value);
            if(exists){
                sel.value=value;
                custom.value='';
                custom.style.display='none';
            }else{
                sel.value='その他';
                custom.value=value;
                custom.style.display='block';
            }
        }

            row.querySelector('.ing-subcategory').value=item.subcategory; onIngredientSubcategoryChange(row.querySelector('.ing-subcategory'));
            row.querySelector('.ing-name').value=key;

        function ingredientRowsToText(rows) {
            return rows.map(x=>{
                const amount = `${x.qty || '適量'}${x.unit === '適量' ? '' : x.unit}`;
                const cut = x.cut ? `（${x.cut}）` : '';
                return `${getIngredientName(x.key)}:${amount}${cut}`;
            }).join('\n');
        }
        function parseLegacyIngredientText(text) {
            const rows=[];
            String(text||'').split(/\n+/).forEach(line=>{
                let s=line.trim(); if(!s) return;
                s=s.replace(/^[-・●*]\s*/, '').replace(/^\d+[.)、]\s*/, '');
                const parts=s.split(/[:：]/);
                let name=parts[0].trim(); let amount=(parts.slice(1).join(':')||'').trim();
                let cut='';
                const cutMatch=amount.match(/[（(]([^）)]+)[）)]\s*$/);
                if(cutMatch){ cut=cutMatch[1].trim(); amount=amount.replace(cutMatch[0],'').trim(); }
                let key=findIngredientKey(name);
                if(!key) {
                    // 「鶏むね肉 300g」などの空白区切りにも対応
                    const m=s.match(/^(.+?)\s*(\d+(?:\.\d+)?)\s*(kg|g|ml|L|個|本|枚|袋|パック|缶|大さじ|小さじ)?$/i);
                    if(m){ name=m[1].trim(); amount=(m[2]||'')+(m[3]||''); key=findIngredientKey(name); }
                }
                if(!key) return;
                let qty=''; let unit='g';
                const m=amount.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|L|個|本|枚|袋|パック|缶|大さじ|小さじ)?/i);
                if(m){ qty=m[1]; unit=m[2] || (amount.includes('適量')?'適量':'g'); }
                else if(amount.includes('適量')||amount.includes('少々')) { qty=''; unit='適量'; }
                rows.push({key,qty,unit,cut});
            });
            return rows;
        }
        function fillIngredientEditor(ingredients, legacyText) {
            const editor=document.getElementById('ingredientEditor'); editor.innerHTML='';
            const rows=(ingredients&&ingredients.length)?ingredients:parseLegacyIngredientText(legacyText);
            if(rows.length) rows.forEach(x=>createIngredientRow(x)); else addIngredientRow();
        }

        function getRecipeIngredients(recipe){
            const rows=[];

            // まず保存時の材料テキストを優先して読む。
            // 旧データでは ingredients 配列の単位が g に化けている場合があるため、
            // 「じゃがいも:1個」のような明示された単位をこちらから復元する。
            const legacyRows=parseLegacyIngredientText(recipe.ingredientsList||'');
            legacyRows.forEach(x=>{
                rows.push({
                    key:x.key,
                    name:getIngredientName(x.key,x.name||''),
                    qty:(x.qty===null || x.qty===undefined || x.qty==='') ? null : Number(x.qty),
                    unit:String(x.unit||'').trim() || (x.qty!==null && x.qty!==undefined && x.qty!=='' ? 'g' : '適量'),
                    cut:x.cut||''
                });
            });

            // 新形式の ingredients は、テキスト側に存在しない材料だけ補完する。
            // 同じ材料がある場合は、明示された ingredientsList の数量・単位を優先する。
            if(Array.isArray(recipe.ingredients)){
                recipe.ingredients.forEach(x=>{
                    const key=String(x.key||'').trim() || findIngredientKey(x.name||'');
                    if(!key) return;

                    const exists=rows.find(r=>String(r.key||'')===key);
                    if(exists){
                        // legacy側が数量を持っていない場合だけ、新形式から数量を補完
                        const structuredQty=(x.qty===null || x.qty===undefined || x.qty==='') ? null : Number(x.qty);
                        if((exists.qty===null || !Number.isFinite(exists.qty)) && Number.isFinite(structuredQty)){
                            exists.qty=structuredQty;
                            exists.unit=String(x.unit||'').trim() || 'g';
                        }
                        return;
                    }

                    const rawQty=x.qty;
                    const qty=(rawQty===null || rawQty===undefined || rawQty==='') ? null : Number(rawQty);
                    const unit=String(x.unit||'').trim();
                    rows.push({
                        key:key,
                        name:x.name || getIngredientName(key,''),
                        qty:Number.isFinite(qty) ? qty : null,
                        unit:unit || (Number.isFinite(qty) ? 'g' : '適量'),
                        cut:x.cut||''
                    });
                });
            }

            // 古いレシピでメイン食材だけ別フィールドにある場合は、
            // 材料欄に同じ食材が無いときだけ追加する。
            // 数量がどこにも保存されていない場合は「適量」と断定せず「数量未登録」とする。
            const mainKey=String(recipe.ingredientKey||'').trim() || findIngredientKey(recipe.ingredient||'');
            const mainName=String(recipe.ingredient||'').trim();

            if(mainKey || mainName){
                const alreadyIncluded=rows.some(x=>{
                    return (mainKey && String(x.key||'')===mainKey) ||
                           (mainName && String(x.name||'')===mainName) ||
                           (mainKey && String(x.name||'')===getIngredientName(mainKey,''));
                });

                if(!alreadyIncluded){
                    rows.unshift({
                        key:mainKey || mainName,
                        name:mainName || getIngredientName(mainKey,''),
                        qty:null,
                        unit:'数量未登録',
                        cut:''
                    });
                }
            }

            return rows.filter(x=>x.key);
        }

        function normalizeUnitQty(qty,unit){
            if(qty==null || qty==='') return {qty:null,unit};
            const n=Number(qty); if(!Number.isFinite(n)) return {qty:null,unit};
            return {qty:n,unit};
        }
        function calculateShoppingList(){
            const savedIds=JSON.parse(localStorage.getItem('shoppingRecipeIdsV1') || '[]');
            const recipes=allRegisteredRecipesCache.filter(r=>savedIds.includes(r.id));

            if(!recipes.length){
                document.getElementById('shoppingListResult').innerHTML='<div class="shopping-empty">作るリストにレシピがありません。</div>';
                return;
            }

            const totals={};
            const globalServings=Number(document.getElementById('globalServings').value)||2;

            recipes.forEach(recipe=>{
                const baseServings=Number(recipe.servings)||2;
                const ratio=globalServings/baseServings;

                getRecipeIngredients(recipe).forEach(x=>{
                    if(!x.key) return;

                    const qty=(x.qty===null || x.qty===undefined || x.qty==='') ? null : Number(x.qty);
                    const unit=String(x.unit||'').trim();
                    const key=x.key;

                    if(!totals[key]){
                        totals[key]={
                            name:getIngredientName(key,x.name),
                            byUnit:{},
                            category:getIngredientByKey(key)?.category||'その他'
                        };
                    }

                    // 数量が登録されている材料だけ人数に応じて計算。
                    // 数量未登録は「適量」ではなく、データ不足として明示する。
                    if(Number.isFinite(qty) && unit!=='適量' && unit!=='数量未登録'){
                        totals[key].byUnit[unit]=(totals[key].byUnit[unit]||0)+qty*ratio;
                    }else if(unit==='適量'){
                        totals[key].byUnit['適量']=true;
                    }else{
                        totals[key].byUnit['数量未登録']=true;
                    }
                });
            });

            const grouped={};
            Object.values(totals).forEach(x=>{(grouped[x.category] ||= []).push(x);});

            let html='<h4 style="margin:0 0 8px;">🛍️ 買い物リスト</h4>';
            Object.keys(grouped).sort().forEach(cat=>{
                html+=`<div class="shopping-category">${escapeHtml(cat)}</div>`;
                grouped[cat].sort((a,b)=>a.name.localeCompare(b.name,'ja')).forEach(x=>{
                    const parts=Object.entries(x.byUnit).map(([u,v])=>u==='適量'?'適量':`${formatQty(v)}${u}`);
                    html+=`<div class="shopping-item"><span>□ ${escapeHtml(x.name)}</span><strong>${escapeHtml(parts.join(' ＋ '))}</strong></div>`;
                });
            });

            html+='<div class="ingredient-help" style="margin-top:8px;">※登録された数量・単位をそのまま使って人数分を計算します。「適量」は登録時に適量指定された材料だけです。「数量未登録」は材料欄に数量が保存されていない材料です。</div>';
            document.getElementById('shoppingListResult').innerHTML=html;
        }
        function formatQty(n){ return Number.isInteger(n)?String(n):String(Math.round(n*10)/10); }

        // HTMLのonclickから確実に呼べるよう、関数をwindowへ公開
        Object.assign(window, {
            toggleSettingsPanel, checkOwnerPassword, switchImageInput, toggleManageForm, toggleFavForm, toggleCalcForm,
            toggleRegisterForm, hideRegisterForm, handleRecipeSubmit, editCustomRecipe, deleteCustomRecipe,
            suggestRecipe, addIngredientRow, updateMainSubcategories, updateMainIngredients, syncMainIngredient,
            onIngredientCategoryChange, onIngredientSubcategoryChange, onIngredientNameChange, calculateShoppingList,
            toggleFavoriteRecipe, addRecipeToShoppingList, removeRecipeFromShoppingList, renderFavoritesList
        });
    </script>
</body>
</html>
