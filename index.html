<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キッズレシピ提案アプリ（Firebase連携版）</title>
    <style>
        :root {
            --bg-color: #f4efe9;        
            --card-bg: #fcf9f5;         
            --text-main: #594d45;       
            --accent-color: #d4a373;    
            --accent-pink: #d8928c;     
            --border-color: #e3dbd0;    
            --tab-inactive: #e8dfd3;    
            --tab-active: #8c8278;      
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            position: relative;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 680px;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .main-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            width: 100%;
        }

        .recipe-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 4px 20px rgba(89, 77, 69, 0.05);
            flex: 1;
            position: relative;
            box-sizing: border-box;
            min-width: 0;
        }

        .recipe-header {
            display: flex;
            align-items: baseline;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 24px;
        }

        .recipe-no {
            font-size: 0.85rem;
            color: var(--accent-pink);
            letter-spacing: 0.05em;
        }

        .recipe-no span {
            font-size: 1.6rem;
            font-weight: bold;
            display: block;
            line-height: 1;
            margin-top: 2px;
        }

        .recipe-title {
            font-size: 1.5rem;
            font-weight: normal;
            letter-spacing: 0.05em;
            margin: 0;
            color: var(--text-main);
            word-break: break-word;
        }

        .photo-item {
            background-color: #e8dfd3;
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8c8278;
            font-size: 0.9rem;
            position: relative;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .day-tabs {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .day-tab {
            width: 44px;
            height: 52px;
            background-color: var(--tab-inactive);
            border: none;
            border-radius: 8px 0 0 8px;
            color: var(--text-main);
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .day-tab:hover { background-color: #dfd5c7; }
        .day-tab.active { background-color: var(--tab-active); color: #fff; }

        input[type="text"], input[type="password"], select, textarea, input[type="file"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: inherit;
            background: #fff;
            color: var(--text-main);
            margin-bottom: 10px;
        }
        textarea { resize: vertical; min-height: 60px; }
        
        button.app-btn {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 10px 14px;
            cursor: pointer;
            width: 100%;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: 0.2s;
            margin-top: 5px;
            box-sizing: border-box;
        }
        button.app-btn:hover { background: #403630; }
        
        .action-buttons { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-manage, .btn-fav, .btn-calc {
            background: var(--tab-inactive);
            color: var(--text-main);
            font-size: 0.85rem;
            padding: 10px 6px;
            flex: 1;
            min-width: 80px;
            margin: 0;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-manage:hover, .btn-fav:hover, .btn-calc:hover { background: #dfd5c7; }
        
        .box { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; background: #fff; border: 1px solid var(--border-color); }
        .box h3 { margin-top: 0; font-size: 1em; text-align: center; margin-bottom: 12px; color: var(--text-main); }
        
        .search-box { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 20px; }
        .search-box h3 { font-size: 1rem; color: var(--text-main); margin-top: 0; margin-bottom: 15px; text-align: center; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: var(--text-main); }

        .fixed-settings-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: var(--tab-active);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.1em;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fixed-settings-btn:hover { background: var(--text-main); }

        .settings-panel {
            display: none;
            position: fixed;
            top: 60px;
            right: 15px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(89,77,69,0.15);
            border: 1px solid var(--border-color);
            z-index: 999;
            width: 250px;
            box-sizing: border-box;
        }

        .list-item {
            border: 1px solid var(--border-color);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item-title { font-weight: bold; font-size: 0.9rem; cursor: pointer; flex: 1; word-break: break-all; }
        .list-item-title:hover { color: var(--accent-color); }
        
        .badge { display: inline-block; background: var(--tab-inactive); color: var(--text-main); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-right: 5px; }

        .image-input-tabs { display: flex; gap: 5px; margin-bottom: 8px; }
        .img-tab-btn { flex: 1; padding: 6px; font-size: 0.75rem; background: var(--tab-inactive); border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: var(--text-main); }
        .img-tab-btn.active { background: var(--tab-active); color: white; }

        .ingredient-editor { margin-top: 8px; }
        .ingredient-row {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            background: #fcfaf7;
        }
        .ingredient-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .ingredient-row-grid.three { grid-template-columns: 1fr 1fr 1fr; }
        .ingredient-row select, .ingredient-row input { margin-bottom: 6px; }
        .ingredient-row .remove-ingredient-btn {
            width: 100%; padding: 6px; border: 0; border-radius: 5px;
            background: #d8928c; color: #fff; cursor: pointer; font-weight: bold; font-size: 0.8rem;
        }
        .add-ingredient-btn {
            width: 100%; padding: 9px; border: 1px dashed var(--accent-color);
            border-radius: 6px; background: #fff; color: var(--text-main); cursor: pointer; font-weight: bold; font-size: 0.85rem;
        }
        .ingredient-help { font-size: 0.75rem; color: #887c73; line-height: 1.5; margin: 4px 0 8px; }
        .legacy-materials { display: none; }
        .menu-recipe-row {
            border: 1px solid var(--border-color); border-radius: 8px; padding: 9px; margin-bottom: 8px;
            background: #fcfaf7;
        }
        .menu-recipe-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; }
        .calc-actions { display: flex; gap: 6px; margin-top: 10px; }
        .calc-actions button { flex: 1; }

        @media (max-width: 520px) {
            .recipe-card { padding: 15px; }
            .ingredient-row-grid, .ingredient-row-grid.three { grid-template-columns: 1fr; }
        }
    </style>

    <script type="module">

        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCMH1b71DcLIeFR6R5QmqQrSqfqYr-kuQQ",
          authDomain: "recipe-c69de.firebaseapp.com",
          projectId: "recipe-c69de",
          storageBucket: "recipe-c69de.firebasestorage.app",
          messagingSenderId: "171060531271",
          appId: "1:171060531271:web:93c6ff78793783cb54e162",
          measurementId: "G-7B0DGX9648"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.db = db;
        window.storage = storage;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.doc = doc;
        window.deleteDoc = deleteDoc;
        window.updateDoc = updateDoc;
        window.setDoc = setDoc;
        window.ref = ref;
        window.uploadBytes = uploadBytes;
        window.getDownloadURL = getDownloadURL;

        window.onload = async function() {
            loadMethodSelectors();
            await fetchAllRecipesCache(); 
            if (allRegisteredRecipesCache.length > 0) {
                displayRecipe(allRegisteredRecipesCache[0]);
            }
        };
    </script>
</head>
<body>

    <button class="fixed-settings-btn" onclick="toggleSettingsPanel()" title="管理設定">⚙️</button>

    <div id="settingsPanel" class="settings-panel">
        <label style="margin-bottom: 6px; color: var(--text-main); font-size: 0.85rem; display: block;">🔐 パスワード認証</label>
        <div style="display: flex; gap: 5px;">
            <input type="password" id="ownerPassword" placeholder="パスワード(manabe123)" style="padding: 6px; font-size: 0.8rem; flex: 1; margin-bottom: 0;">
            <button class="app-btn" onclick="checkOwnerPassword()" style="margin: 0; width: auto; padding: 6px 10px; font-size: 0.8rem;">解除</button>
        </div>
        <p id="authStatus" style="font-size: 0.75rem; color: #2e7d32; margin-top: 6px; display: none;">認証済みです</p>
        <button class="app-btn" onclick="toggleRegisterForm()" style="margin-top: 8px; font-size: 0.8rem; padding: 6px;">➕ 新規レシピ登録を開く</button>
    </div>

    <div class="app-container">
        
        <!-- 新規レシピ登録・編集フォーム -->
        <div id="registerForm" class="box register-box" style="position: absolute; z-index: 100; top: 20px; left: 20px; right: 20px; max-width: 640px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: #fcf9f5;">
            <h3 id="formHeading">オリジナルレシピ登録</h3>
            <input type="hidden" id="editDocId" value="">
            
            <div class="input-group">
                <label>📸 料理の画像追加</label>
                <div class="image-input-tabs">
                    <button type="button" id="tabFileBtn" class="img-tab-btn active" onclick="switchImageInput('file')">📁 ファイル選択</button>
                    <button type="button" id="tabUrlBtn" class="img-tab-btn" onclick="switchImageInput('url')">🔗 URL入力</button>
                </div>
                <div id="fileInputArea">
                    <input type="file" id="regImageFile" accept="image/*">
                </div>
                <div id="urlInputArea" style="display: none;">
                    <input type="text" id="regImageUrl" placeholder="例：https://example.com/image.jpg">
                </div>
            </div>

            <div class="input-group">
                <label>🍅 メイン食材</label>
                <div class="ingredient-row-grid">
                    <select id="regMainCategory" onchange="updateMainSubcategories()"></select>
                    <select id="regMainSubcategory" onchange="updateMainIngredients()"></select>
                </div>
                <select id="regMainIngredient" onchange="syncMainIngredient()" style="margin-top: 6px;"></select>
                <input type="hidden" id="regIngredient">
                <div class="ingredient-help">食材マスターから選択して登録できます。</div>
            </div>

            <div class="input-group">
                <label>🏷️ ジャンル</label>
                <select id="regGenre">
                    <option value="メイン">メイン</option>
                    <option value="副菜">副菜</option>
                    <option value="汁物">汁物</option>
                    <option value="主食(ご飯・麺)">主食(ご飯・麺)</option>
                    <option value="デザート">デザート</option>
                    <option value="お弁当">お弁当</option>
                    <option value="作り置き">作り置き</option>
                </select>
            </div>

            <div class="input-group">
                <label>⏱️ 調理方法</label>
                <select id="regMethod"></select>
            </div>
            
            <div class="input-group">
                <label>⌛ 所要時間</label>
                <select id="regTime">
                    <option value="5分">5分</option>
                    <option value="15分">15分</option>
                    <option value="30分">30分</option>
                    <option value="1時間">1時間</option>
                </select>
            </div>

            <div class="input-group">
                <label>📝 レシピ名</label>
                <input type="text" id="regTitle" placeholder="例：ワンパン豆腐ハンバーグ">
            </div>

            <div class="input-group">
                <label>🛒 用意するもの（食材リスト）</label>
                <div class="ingredient-help">カテゴリ・食材・分量・切り方を指定してください。</div>
                <div id="ingredientEditor" class="ingredient-editor"></div>
                <button type="button" class="add-ingredient-btn" onclick="addIngredientRow()">＋ 食材を追加</button>
            </div>
            
            <div class="input-group">
                <label>🍳 手順（作り方）</label>
                <textarea id="regSteps" placeholder="例：1. 玉ねぎを切る&#10;2. 混ぜて焼く"></textarea>
            </div>

            <button class="app-btn" id="submitRecipeBtn" onclick="handleRecipeSubmit()">このレシピを登録</button>
            <button class="app-btn" onclick="hideRegisterForm()" style="background: #a89f91;">閉じる</button>
        </div>

                <div id="manageForm" class="box manage-box">

                <div id="calcBox" class="box calc-box">
                    <h3>🗓️ 献立 → 必要食材 → 買い物リスト</h3>
                    <div class="ingredient-help" style="margin-bottom:12px;">作りたいレシピにチェックを入れ、人数を設定すると必要数量を計算します。</div>
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label for="servingCount">👥 何人分作りますか？</label>

                    </div>
                    <div id="menuRecipeList"></div>
                    <div class="calc-actions">

                    </div>
                    <div id="shoppingListResult" style="margin-top:14px;"></div>
                </div>

                <div class="search-box">
                    <h3>🔍 レシピを探す</h3>
                    <div class="input-group">
                        <label for="searchIngredient">🍅 食材・キーワード</label>
                        <input type="text" id="searchIngredient" placeholder="例：豆腐、ハンバーグ（空欄でもOK）">
                    </div>
                    <div class="input-group">
                        <label for="searchGenre">🏷️ ジャンル</label>
                        <select id="searchGenre">
                            <option value="any">指定なし</option>
                            <option value="メイン">メイン</option>
                            <option value="副菜">副菜</option>
                            <option value="汁物">汁物</option>
                            <option value="主食(ご飯・麺)">主食(ご飯・麺)</option>
                            <option value="デザート">デザート</option>
                            <option value="お弁当">お弁当</option>
                            <option value="作り置き">作り置き</option>
                        </select>
                    </div>
                    <button class="app-btn" onclick="suggestRecipe()">この条件で探す</button>
                </div>
                
                <div id="result" class="box" style="display: none; background: transparent; border: none; padding: 0;"></div>

                <div id="recipeDetailArea">
                    <div class="recipe-header">
                        <div class="recipe-no">
                            Recipe<br><span id="detailNo">01</span>
                        </div>
                        <h1 class="recipe-title" id="detailTitle">本日のレシピ</h1>
                        <div style="margin-left: auto; display: flex; gap: 8px; align-items: center;">
                            <button id="favBtn" onclick="toggleFavoriteCurrent()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;" title="お気に入り">☆</button>
                        </div>
                    </div>

                    <div class="photo-item" id="detailImage">
                        <img id="detailImgSrc" src="https://placehold.co/600x400/e8dfd3/8c8278?text=Recipe" alt="料理画像" onerror="this.src='https://placehold.co/600x400/e8dfd3/8c8278?text=Recipe'">

                    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">

                        <span class="badge" id="detailMethod">調理方法</span>
                        <span class="badge" id="detailTime">時間</span>
                    </div>

                    <div class="box" style="display: block; background: #fff;">
                        <h3>🍳 作り方</h3>
                        <div id="detailSteps" style="font-size: 0.95rem; white-space: pre-wrap; line-height: 1.6;"></div>
                    </div>
                </div>

            </div>

            <div class="day-tabs">
                <button class="day-tab">月</button>
                <button class="day-tab">火</button>
                <button class="day-tab active">水</button>
                <button class="day-tab">木</button>
                <button class="day-tab">金</button>
            </div>
        </div>
    </div>

                    {key:"tuna_can", name:"ツナ缶"}
                ]
            },
            "卵・大豆・乳製品": {
                "卵・豆腐": [
                    {key:"egg", name:"卵"},
                    {key:"tofu_cotton", name:"木綿豆腐"},
                    {key:"tofu_silken", name:"絹ごし豆腐"},
                    {key:"aburaage", name:"油揚げ"}
                ],
                "乳製品": [
                    {key:"milk", name:"牛乳"},
                    {key:"butter", name:"バター"},
                    {key:"cheese", name:"チーズ"}
                ]
            }
        };

        const METHOD_LIST = [
            "炒める", "焼く", "煮る", "揚げる", "蒸す", "レンジ", "和える", "炊く"
        ];

        const CUT_OPTIONS = [
            "指定なし", "みじん切り", "薄切り", "乱切り", "一口大", "千切り", "すりおろし", "そのまま"
        ];

        function loadMethodSelectors() {
            const methodSelect = document.getElementById('regMethod');
            if (methodSelect) {
                methodSelect.innerHTML = METHOD_LIST.map(m => `<option value="${m}">${m}</option>`).join('');
            }

            const catSelect = document.getElementById('regMainCategory');
            if (catSelect) {
                catSelect.innerHTML = Object.keys(INGREDIENT_MASTER).map(c => `<option value="${c}">${c}</option>`).join('');
                updateMainSubcategories();
            }
        }

        function updateMainSubcategories() {
            const cat = document.getElementById('regMainCategory').value;
            const subSelect = document.getElementById('regMainSubcategory');
            const subs = INGREDIENT_MASTER[cat] ? Object.keys(INGREDIENT_MASTER[cat]) : [];
            subSelect.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
            updateMainIngredients();
        }

        function updateMainIngredients() {
            const cat = document.getElementById('regMainCategory').value;
            const sub = document.getElementById('regMainSubcategory').value;
            const ingSelect = document.getElementById('regMainIngredient');
            const items = (INGREDIENT_MASTER[cat] && INGREDIENT_MASTER[cat][sub]) ? INGREDIENT_MASTER[cat][sub] : [];
            ingSelect.innerHTML = items.map(i => `<option value="${i.key}">${i.name}</option>`).join('');
            syncMainIngredient();
        }

        function syncMainIngredient() {
            const ingSelect = document.getElementById('regMainIngredient');
            const hidden = document.getElementById('regIngredient');
            if (ingSelect && hidden) {
                hidden.value = ingSelect.value;
            }
        }

        function switchImageInput(mode) {
            currentImageMode = mode;
            document.getElementById('tabFileBtn').classList.toggle('active', mode === 'file');
            document.getElementById('tabUrlBtn').classList.toggle('active', mode === 'url');
            document.getElementById('fileInputArea').style.display = mode === 'file' ? 'block' : 'none';
            document.getElementById('urlInputArea').style.display = mode === 'url' ? 'block' : 'none';
        }

        function addIngredientRow(data = null) {
            const editor = document.getElementById('ingredientEditor');
            const rowId = 'ing_row_' + (ingredientRowSeq++);
            
            let catOptions = Object.keys(INGREDIENT_MASTER).map(c => `<option value="${c}" ${data && data.category === c ? 'selected' : ''}>${c}</option>`).join('');
            const initialCat = data ? data.category : Object.keys(INGREDIENT_MASTER)[0];
            const subs = INGREDIENT_MASTER[initialCat] ? Object.keys(INGREDIENT_MASTER[initialCat]) : [];
            let subOptions = subs.map(s => `<option value="${s}" ${data && data.subcategory === s ? 'selected' : ''}>${s}</option>`).join('');
            
            const initialSub = data ? data.subcategory : subs[0];
            const items = (INGREDIENT_MASTER[initialCat] && INGREDIENT_MASTER[initialCat][initialSub]) ? INGREDIENT_MASTER[initialCat][initialSub] : [];
            let itemOptions = items.map(i => `<option value="${i.key}" ${data && data.ingredientKey === i.key ? 'selected' : ''}>${i.name}</option>`).join('');

            let cutOptionsHtml = CUT_OPTIONS.map(c => `<option value="${c}" ${data && data.cut === c ? 'selected' : ''}>${c}</option>`).join('');

            const rowDiv = document.createElement('div');
            rowDiv.className = 'ingredient-row';
            rowDiv.id = rowId;
            rowDiv.innerHTML = `
                <div class="ingredient-row-grid">
                    <select onchange="onRowCategoryChange('${rowId}')" class="row-cat">${catOptions}</select>
                    <select onchange="onRowSubcategoryChange('${rowId}')" class="row-sub">${subOptions}</select>
                </div>
                <div class="ingredient-row-grid three" style="margin-top:6px;">
                    <select class="row-item">${itemOptions}</select>
                    <input type="text" class="row-amount" placeholder="数量(例: 1/2丁)" value="${data ? data.amount : ''}" style="margin:0;">
                    <select class="row-cut">${cutOptionsHtml}</select>
                </div>
                <button type="button" class="remove-ingredient-btn" style="margin-top:8px;" onclick="document.getElementById('${rowId}').remove()">この食材を削除</button>
            `;
            editor.appendChild(rowDiv);
        }

        function onRowCategoryChange(rowId) {
            const row = document.getElementById(rowId);
            const cat = row.querySelector('.row-cat').value;
            const subSelect = row.querySelector('.row-sub');
            const itemSelect = row.querySelector('.row-item');

            const subs = INGREDIENT_MASTER[cat] ? Object.keys(INGREDIENT_MASTER[cat]) : [];
            subSelect.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
            
            const initialSub = subs[0] || '';
            const items = (INGREDIENT_MASTER[cat] && INGREDIENT_MASTER[cat][initialSub]) ? INGREDIENT_MASTER[cat][initialSub] : [];
            itemSelect.innerHTML = items.map(i => `<option value="${i.key}">${i.name}</option>`).join('');
        }

        function onRowSubcategoryChange(rowId) {
            const row = document.getElementById(rowId);
            const cat = row.querySelector('.row-cat').value;
            const sub = row.querySelector('.row-sub').value;
            const itemSelect = row.querySelector('.row-item');

            const items = (INGREDIENT_MASTER[cat] && INGREDIENT_MASTER[cat][sub]) ? INGREDIENT_MASTER[cat][sub] : [];
            itemSelect.innerHTML = items.map(i => `<option value="${i.key}">${i.name}</option>`).join('');
        }

        async function fetchAllRecipesCache() {
            try {
                const querySnapshot = await getDocs(collection(window.db, "recipes"));
                allRegisteredRecipesCache = [];
                querySnapshot.forEach((docSnap) => {
                    allRegisteredRecipesCache.push({ id: docSnap.id, ...docSnap.data() });
                });
                
                // If default recipes are empty, push seed data
                if (allRegisteredRecipesCache.length === 0) {
                    const seed = {
                        title: "ワンパン豆腐ハンバーグ",
                        imageUrl: "https://placehold.co/600x400/e8dfd3/8c8278?text=Tofu+Hamburg",
                        genre: "メイン",
                        method: "焼く",
                        time: "15分",
                        steps: "1. 豆腐の水気を軽く切る。\n2. ひき肉、豆腐、調味料を袋に入れて揉み込む。\n3. フライパンで両面をこんがり焼く。",
                        ingredients: [
                            { category: "肉・加工肉", subcategory: "ひき肉・加工", ingredientKey: "mixed_mince", amount: "150g", cut: "指定なし" },
                            { category: "卵・大豆・乳製品", subcategory: "卵・豆腐", ingredientKey: "tofu_cotton", amount: "1/2丁", cut: "指定なし" }
                        ],
                        isFavorite: false
                    };
                    const docRef = await addDoc(collection(window.db, "recipes"), seed);
                    allRegisteredRecipesCache.push({ id: docRef.id, ...seed });
                }
                displayCustomRecipes();
                renderFavoritesList();
                renderMenuRecipeCheckList();
            } catch (err) {
                console.error("Error fetching recipes:", err);
            }
        }

        window.toggleSettingsPanel = function() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        window.checkOwnerPassword = function() {
            const pass = document.getElementById('ownerPassword').value;
            const status = document.getElementById('authStatus');
            if (pass === OWNER_SECRET) {
                isOwner = true;
                status.style.display = 'block';
                status.innerText = "認証成功：オーナー権限有効";
            } else {
                alert("パスワードが違います");
            }
        }

        window.toggleRegisterForm = function() {
            if (!isOwner) {
                alert("管理者パスワードを解除してください（デフォルト: manabe123）");
                return;
            }
            const box = document.getElementById('registerForm');
            const isVis = box.style.display === 'block';
            box.style.display = isVis ? 'none' : 'block';
            if (!isVis) {
                document.getElementById('formHeading').innerText = "オリジナルレシピ登録";
                document.getElementById('editDocId').value = "";
                document.getElementById('regTitle').value = "";
                document.getElementById('regSteps').value = "";
                document.getElementById('ingredientEditor').innerHTML = "";
                addIngredientRow();
            }
            toggleSettingsPanel();
        }

        window.hideRegisterForm = function() {
            document.getElementById('registerForm').style.display = 'none';
        }

        window.toggleManageForm = function() {
            const box = document.getElementById('manageForm');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
            displayCustomRecipes();
        }

        window.toggleFavForm = function() {
            const box = document.getElementById('favForm');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
            renderFavoritesList();
        }

        window.toggleCalcForm = function() {
            const box = document.getElementById('calcBox');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
            renderMenuRecipeCheckList();
        }

        window.displayCustomRecipes = function() {
            const listDiv = document.getElementById('customRecipesList');
            if (!listDiv) return;
            if (allRegisteredRecipesCache.length === 0) {
                listDiv.innerHTML = '<p>登録されたレシピはありません。</p>';
                return;
            }
            let html = '';
            allRegisteredRecipesCache.forEach(r => {
                html += `
                    <div class="list-item">
                        <span class="list-item-title" onclick="selectRecipe('${r.id}')">${r.title}</span>
                        <div style="display:flex; gap:6px; align-items:center;">
                            <span class="badge">${r.genre}</span>
                            ${isOwner ? `<button class="edit-btn" onclick="editRecipe('${r.id}')">編集</button>` : ''}
                            ${isOwner ? `<button class="delete-btn" onclick="deleteRecipe('${r.id}')">削除</button>` : ''}
                        </div>
                    </div>
                `;
            });
            listDiv.innerHTML = html;
        }

        window.renderFavoritesList = function() {
            const listDiv = document.getElementById('favoritesList');
            if (!listDiv) return;
            const favs = allRegisteredRecipesCache.filter(r => r.isFavorite);
            if (favs.length === 0) {
                listDiv.innerHTML = '<p>お気に入り登録されたレシピはありません。</p>';
                return;
            }
            let html = '';
            favs.forEach(r => {
                html += `
                    <div class="list-item">
                        <span class="list-item-title" onclick="selectRecipe('${r.id}')">${r.title}</span>
                        <span class="badge">${r.genre}</span>
                    </div>
                `;
            });
            listDiv.innerHTML = html;
        }

        window.renderMenuRecipeCheckList = function() {
            const container = document.getElementById('menuRecipeList');
            if (!container) return;
            let html = '';
            allRegisteredRecipesCache.forEach(r => {
                html += `
                    <div class="menu-recipe-row">
                        <label>
                            <input type="checkbox" class="calc-recipe-check" value="${r.id}" onchange="calculateShoppingList()">
                            <span>${r.title} <small style="color:#888;">(${r.genre})</small></span>
                        </label>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.selectRecipe = function(id) {
            const r = allRegisteredRecipesCache.find(x => x.id === id);
            if (r) {
                displayRecipe(r);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        window.displayRecipe = function(r) {
            currentViewingRecipeId = r.id;
            document.getElementById('detailNo').innerText = r.id.slice(-2);
            document.getElementById('detailTitle').innerText = r.title;
            document.getElementById('detailImgSrc').src = r.imageUrl || "https://placehold.co/600x400/e8dfd3/8c8278?text=Recipe";
            document.getElementById('detailGenre').innerText = r.genre;
            document.getElementById('detailMethod').innerText = r.method || "調理法なし";
            document.getElementById('detailTime').innerText = r.time;
            document.getElementById('detailSteps').innerText = r.steps;

            updateFavoriteButtonState();
            document.getElementById('recipeDetailArea').style.display = 'block';
        }

        window.toggleFavoriteCurrent = async function() {
            if (!currentViewingRecipeId) return;
            const r = allRegisteredRecipesCache.find(x => x.id === currentViewingRecipeId);
            if (r) {
                r.isFavorite = !r.isFavorite;
                await updateDoc(doc(window.db, "recipes", r.id), { isFavorite: r.isFavorite });
                updateFavoriteButtonState();
                renderFavoritesList();
            }
        }

        window.updateFavoriteButtonState = function() {
            const btn = document.getElementById('favBtn');
            if (!btn) return;
            const r = allRegisteredRecipesCache.find(x => x.id === currentViewingRecipeId);
            if (r && r.isFavorite) {
                btn.innerText = '★';
                btn.style.color = '#e0a96d';
            } else {
                btn.innerText = '☆';
                btn.style.color = 'inherit';
            }
        }

        window.editRecipe = function(id) {
            if (!isOwner) return;
            const r = allRegisteredRecipesCache.find(x => x.id === id);
            if (!r) return;

            document.getElementById('formHeading').innerText = "レシピ編集";
            document.getElementById('editDocId').value = r.id;
            document.getElementById('regTitle').value = r.title;
            document.getElementById('regGenre').value = r.genre;
            document.getElementById('regMethod').value = r.method || METHOD_LIST[0];
            document.getElementById('regTime').value = r.time;
            document.getElementById('regSteps').value = r.steps;
            document.getElementById('regImageUrl').value = r.imageUrl || "";

            const editor = document.getElementById('ingredientEditor');
            editor.innerHTML = "";
            if (r.ingredients && r.ingredients.length > 0) {
                r.ingredients.forEach(ing => addIngredientRow(ing));
            } else {
                addIngredientRow();
            }

            document.getElementById('registerForm').style.display = 'block';
            if (document.getElementById('manageForm').style.display === 'block') {
                toggleManageForm();
            }
        }

        window.deleteRecipe = async function(id) {
            if (!isOwner) return;
            if (confirm("本当にこのレシピを削除しますか？")) {
                await deleteDoc(doc(window.db, "recipes", id));
                await fetchAllRecipesCache();
                alert("レシピを削除しました");
            }
        }

        window.handleRecipeSubmit = async function() {
            const editId = document.getElementById('editDocId').value;
            const title = document.getElementById('regTitle').value.trim();
            const genre = document.getElementById('regGenre').value;
            const method = document.getElementById('regMethod').value;
            const time = document.getElementById('regTime').value;
            const steps = document.getElementById('regSteps').value.trim();
            
            if (!title || !steps) {
                alert("レシピ名と手順を入力してください。");
                return;
            }

            let imageUrl = document.getElementById('regImageUrl').value.trim();
            const fileInput = document.getElementById('regImageFile');

            if (currentImageMode === 'file' && fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const storageRef = ref(window.storage, 'recipes/' + Date.now() + '_' + file.name);
                try {
                    const snapshot = await uploadBytes(storageRef, file);
                    imageUrl = await getDownloadURL(snapshot.ref);
                } catch (e) {
                    console.error("Storage upload error:", e);
                    imageUrl = imageUrl || "https://placehold.co/600x400/e8dfd3/8c8278?text=Recipe";
                }
            } else if (!imageUrl) {
                imageUrl = "https://placehold.co/600x400/e8dfd3/8c8278?text=Recipe";
            }

            const ingredientRows = document.querySelectorAll('.ingredient-row');
            let ingredients = [];
            ingredientRows.forEach(row => {
                ingredients.push({
                    category: row.querySelector('.row-cat').value,
                    subcategory: row.querySelector('.row-sub').value,
                    ingredientKey: row.querySelector('.row-item').value,
                    amount: row.querySelector('.row-amount').value.trim() || '適量',
                    cut: row.querySelector('.row-cut').value
                });
            });

            const recipeData = {
                title, genre, method, time, steps, imageUrl, ingredients,
                isFavorite: false
            };

            if (editId) {
                await updateDoc(doc(window.db, "recipes", editId), recipeData);
                alert("レシピを更新しました！");
            } else {
                await addDoc(collection(window.db, "recipes"), recipeData);
                alert("新しいレシピを登録しました！");
            }

            hideRegisterForm();
            await fetchAllRecipesCache();
        }

        window.suggestRecipe = function() {
            const sIng = document.getElementById('searchIngredient').value.trim().toLowerCase();
            const sGenre = document.getElementById('searchGenre').value;

            const filtered = allRegisteredRecipesCache.filter(r => {
                if (sGenre !== 'any' && r.genre !== sGenre) return false;
                if (sIng) {
                    const matchTitle = r.title.toLowerCase().includes(sIng);
                    const matchSteps = r.steps.toLowerCase().includes(sIng);
                    const matchIng = r.ingredients && r.ingredients.some(i => i.ingredientKey.toLowerCase().includes(sIng) || i.amount.toLowerCase().includes(sIng));
                    if (!matchTitle && !matchSteps && !matchIng) return false;
                }
                return true;
            });

            const resBox = document.getElementById('result');
            resBox.style.display = 'block';

            if (filtered.length === 0) {
                resBox.innerHTML = '<div style="background:#fff; padding:15px; border-radius:8px; text-align:center; border: 1px solid var(--border-color);">条件に一致するレシピが見つかりませんでした。</div>';
                return;
            }

            let html = '<div style="background:#fff; padding:15px; border-radius:8px; border: 1px solid var(--border-color); margin-bottom:20px;">';
            html += `<h3 style="margin-top:0; font-size:1rem; text-align:center; color:var(--text-main);">🔍 検索結果 (${filtered.length}件)</h3>`;
            filtered.forEach(r => {
                html += `
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding:10px 0;">
                        <div>
                            <span style="font-weight:bold; cursor:pointer;" onclick="selectRecipe('${r.id}')">${r.title}</span>
                            <div style="font-size:0.75rem; color:#888; margin-top:2px;">${r.genre} / ${r.time}</div>
                        </div>
                        <button class="app-btn" style="width:auto; padding:4px 10px; font-size:0.8rem; margin:0;" onclick="selectRecipe('${r.id}')">見る</button>
                    </div>
                `;
            });
            html += '</div>';
            resBox.innerHTML = html;
        }

        window.calculateShoppingList = function() {
            const checks = document.querySelectorAll('.calc-recipe-check:checked');
            const res = document.getElementById('shoppingListResult');
            const servings = parseInt(document.getElementById('servingCount').value, 10) || 2;
            
            let selectedIds = [];
            checks.forEach(c => selectedIds.push(c.value));
            
            if (selectedIds.length === 0) {
                res.innerHTML = '<div class="shopping-empty">レシピが選択されていません。チェックを入れてください。</div>';
                return;
            }
            
            let aggregated = {};
            selectedIds.forEach(id => {
                const r = allRegisteredRecipesCache.find(x => x.id === id);
                if (r && r.ingredients) {
                    r.ingredients.forEach(ing => {
                        const key = ing.ingredientKey || ing.category;
                        if (!aggregated[key]) {
                            aggregated[key] = {
                                name: ing.ingredientKey,
                                category: ing.category,
                                amounts: [],
                                cuts: new Set(),
                                recipes: new Set()
                            };
                        }
                        aggregated[key].amounts.push(ing.amount);
                        if (ing.cut && ing.cut !== '指定なし') aggregated[key].cuts.add(ing.cut);
                        aggregated[key].recipes.add(r.title);
                    });
                }
            });

            let html = '<div class="box" style="display:block; background:#fff; margin-top:10px;">';
            html += `<h4 style="margin-top:0; color:var(--text-main); border-bottom:1px solid var(--border-color); padding-bottom:8px;">🛒 買い物リスト (${servings}人分換算)</h4>`;
            
            for (let k in aggregated) {
                const item = aggregated[k];
                const cutsStr = item.cuts.size > 0 ? ` [切り方: ${Array.from(item.cuts).join(', ')}]` : '';
                html += `
                    <div class="shopping-item">
                        <div>
                            <b>${item.name}</b> <span style="font-size:0.8rem; color:#666;">${item.amounts.join(', ')}</span>${cutsStr}
                        </div>
                        <div style="font-size:0.75rem; color:#888;">${Array.from(item.recipes).join(', ')}</div>
                    </div>
                `;
            }
            html += '</div>';
            res.innerHTML = html;
        }
    </script>
</body>
</html>
